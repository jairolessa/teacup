<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/imgs/logo.svg}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <title>TEAcup - Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/tea-cad.css}">

    <style>

    </style>
</head>
<body>
    <a th:href="@{/responsible/portal}" class="btn-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Voltar</span>
    </a>

    <div class="container decorative-corners">
        <h1>Cadastro de Dependente</h1>
        
        <div class="stars">✶ ✶ ✶</div>
        
        <div class="vintage-pattern"></div>
        
        <form id="registrationForm" action="" method="post">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="fullName" required>
            </div>
            
            <div class="col-2">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="data_nascimento">Data de Nascimento</label>
                    <input type="date" id="data_nascimento" name="birthDate" required>
                </div>

                 <div class="form-group">
                            <label for="genero">Gênero</label>
                            <select id="genero" class="form-control" name="gender" required></select>
                        </div>

            </div>
            
            <div class="col-2">
                
                <div class="form-group">
                    <label for="telefone">Telefone de Contato</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>
            </div>

                <div class="col-3">
                    <div class="form-group">
                            <label for="parentesco">Natureza do Vínculo</label>
                            <select id="parentesco" class="form-control" name="bondNature"required></select>
                        </div>

                        <div class="form-group">
                            <label for="nivelSuporte">Nível de Suporte</label>
                            <select id="nivelSuporte" class="form-control" name="supportLevels" required></select>
                        </div>
                </div>  
                        
                        <div class="form-group">
                            <label for="escola">Instituição de Ensino (se houver)</label>
                            <input type="text" id="escola" class="form-control" name="educationInstitute">
                        </div>
                 
                    
                    <div class="form-group">
                        <label for="info-saude">Informações de Saúde (alergias, medicações, etc.)</label>
                        <textarea id="info-saude" class="form-control" name="healthInfo" rows="3"></textarea>
                    </div>
                
                <div class="col-4">    
                    <div class="form-group">
                        <label for="contato-emergencia">Contato de Emergência (além do tutor)</label>
                        <input type="text" id="contato-emergencia" name="emergencyContact" class="form-control" placeholder="(00) 00000-0000">
                    </div> 

                    <div class="form-group">
                        <label for="laudo-doc">Anexe o laudo de diagnóstico</label>
                        <input type="file" id="laudo-doc" class="form-control" name="diagnostic" >
                    </div>
                </div>                      
            
            <div class="vintage-pattern"></div>
            
            <button type="submit" class="btn">Cadastrar</button>
        </form>
        
        <div class="stars">✶ ✶ ✶</div>


        <script th:src="@{/js/tea-cad.js}"></script>
    </div>    
</body>
</html>
