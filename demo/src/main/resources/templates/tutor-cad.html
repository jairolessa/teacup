<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/imgs/logo.svg}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <title>TEAcup - Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/tutor-cad.css}">
</head>
<body>      
    <div class="container decorative-corners">
        <h1>Cadastro de Tutor</h1>
        
        <div class="stars">✶ ✶ ✶</div>
        
        <div class="vintage-pattern"></div>
        
            <form id="registrationForm" th:action="@{/responsible/new}"
                  th:object="${responsibleDto}" method="POST">

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" th:field="*{fullName}" placeholder="Digite o nome completo">
                <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></span>
            </div>
            
            <div class="col-2">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00" required>
                    <span th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-danger"></span>
                </div>

                <div class="form-group">
                    <label for="data_nascimento">Data de Nascimento</label>
                    <input type="date" id="data_nascimento" th:field="*{birthDate}" required>
                    <span th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}" class="text-danger"></span>
                </div>

                <div class="form-group">
                            <label for="genero">Gênero</label>
                            <select id="genero" class="form-control" th:field="*{gender}" required></select>
                    <span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="text-danger"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" required>
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
            </div>
            
            <div class="col-2">
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" th:field="*{cep}" placeholder="00000-000" required>
                    <span th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}" class="text-danger"></span>
                </div>
                
                <div class="form-group">
                    <label for="telefone">Telefone de Contato</label>
                    <input type="tel" id="telefone" th:field="*{contactNumber}" placeholder="(00) 00000-0000"
                           required>
                    <span th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}" class="text-danger"></span>
                </div>
            </div>

            <div class="form-group">
                <div class="endereco-container">
                    <div class="endereco-titulo">Endereço</div>
                    
                    <div class="endereco-grupo endereco-full-width">
                        <label for="endereco">Logradouro</label>
                        <input type="text" id="endereco" th:field="*{publicPlace}" required>
                        <span th:if="${#fields.hasErrors('publicPlace')}" th:errors="*{publicPlace}" class="text-danger"></span>
                    </div>
                    
                    <div class="endereco-grupo numero">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="houseNumber">
                    </div>
                    
                    <div class="endereco-grupo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="neighbourhood">
                        <span th:if="${#fields.hasErrors('neighbourhood')}" th:errors="*{neighbourhood}" class="text-danger"></span>
                    </div>
                    
                    <div class="endereco-grupo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" th:field="*{city}">
                        <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="text-danger"></span>
                    </div>
                    
                        <div class="endereco-grupo">
                            <label for="estado">Estado</label>
                            <select id="estado" th:field="*{state}"></select>
                            <span th:if="${#fields.hasErrors('state')}" th:errors="*{state}" class="text-danger"></span>
                        </div>
                        
                        <div class="endereco-grupo endereco-full-width">
                            <label for="info-complemento">Complemento</label>
                            <textarea id="info-complemento" class="form-control" name="complement" rows="3"></textarea>
                        </div>
                </div>
            </div>

            
            <div class="col-3">   
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="password" placeholder="Digite sua senha">
                </div>
                
                <div class="form-group">
                    <label for="confirmar_senha">Confirmar Senha</label>
                    <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Digite novamente a sua senha">
                </div>
            </div>    
            <div class="vintage-pattern"></div>
            <button type="submit" class="btn">Cadastrar</button>
        </form>
        <div class="stars">✶ ✶ ✶</div>
        
    </div>

    <script th:src="@{/js/tutor-cad.js}"></script>

</body>
</html>
